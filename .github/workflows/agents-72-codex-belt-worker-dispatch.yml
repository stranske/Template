# Wrapper workflow to allow workflow_dispatch for the Codex belt worker.
name: Agents 72 Codex Belt Worker Dispatch

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
        type: string
      branch:
        description: 'Branch to prepare (codex/issue-<n>)'
        required: true
        type: string
      base:
        description: 'Base branch (defaults to repository default)'
        required: false
        default: ''
        type: string
      source:
        description: 'Source of the worker invocation'
        required: false
        default: 'manual-dispatch'
        type: string
      dry_run:
        description: 'Preview worker actions without writes'
        required: false
        default: false
        type: boolean
      use_step_branch:
        description: 'Allow fallback step branch when issue branch is stale'
        required: false
        default: false
        type: boolean
      max_parallel:
        description: 'Maximum concurrent worker runs permitted'
        required: false
        default: 1
        type: number
      keepalive:
        description: 'True when invocation originates from a keepalive sweep'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  run-worker:
    name: Run Codex belt worker
    runs-on: ubuntu-latest
    steps:
      - name: Fail because reusable workflow is missing
        run: |
          echo "The reusable workflow '.github/workflows/agents-72-codex-belt-worker.yml' is not available in this repository."
          echo "This dispatch wrapper cannot run the Codex belt worker until that workflow is added."
          echo "Inputs received:"
          echo "  issue: ${{ inputs.issue }}"
          echo "  branch: ${{ inputs.branch }}"
          echo "  base: ${{ inputs.base }}"
          echo "  source: ${{ inputs.source }}"
          echo "  dry_run: ${{ inputs.dry_run }}"
          echo "  use_step_branch: ${{ inputs.use_step_branch }}"
          echo "  max_parallel: ${{ inputs.max_parallel }}"
          echo "  keepalive: ${{ inputs.keepalive }}"
          exit 1
